[package]
name = "pdf-editor"
version = "0.1.0"
edition = "2021"
description = "Offline, client-side PDF editor (Rust + WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }
hayro = "0.7"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

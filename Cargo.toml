[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "crates/worker", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# hayro needs 1.92; slice::as_chunks needs 1.88.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/yunophilia/pdf-editor"

[workspace.dependencies]
pdf-editor-shared = { path = "crates/shared" }
pdf-editor-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package]
name = "pdf-editor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-editor-shared = { workspace = true }
dioxus = { version = "0.7", features = ["router"] }
serde = { workspace = true }
serde_json = "1"
futures-channel = "0.3"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Desktop talks to the engine directly on a worker thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdf-editor-core = { workspace = true }
dioxus = { version = "0.7", features = ["router", "desktop"] }
rfd = "0.15"

# Web drives the engine through a Web Worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", features = ["router", "web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Window", "Document", "Element", "Location", "Request", "RequestInit", "Response"] }

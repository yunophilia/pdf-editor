[package]
name = "pdf-editor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pdf-editor-shared = { workspace = true }
dioxus = { version = "0.7", features = ["router"] }
serde = { workspace = true }
serde_json = "1"

# Desktop talks to the engine directly on a worker thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdf-editor-core = { workspace = true }
dioxus = { version = "0.7", features = ["router", "desktop"] }
rfd = "0.15"

# Web drives the engine through a Web Worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", features = ["router", "web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Blob", "Url", "File", "FileList", "HtmlInputElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Window", "Document", "Element", "DomRect"] }

# Thin wasm shim: hosts the engine inside a Web Worker on the web target.
# The desktop build does not use this crate at all — it calls the core directly
# on a background thread.
[package]
name = "pdf-editor-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-editor-core = { workspace = true }
pdf-editor-shared = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = "1"
console_error_panic_hook = "0.1"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Editor</title>
  <meta name="description" content="Offline PDF editor. Everything runs in your browser — nothing is uploaded.">
  <meta name="theme-color" content="#1f2328">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <button id="btn-open" title="Open a PDF (Ctrl+O)">Open</button>
      <button id="btn-new" title="New blank document">New</button>
      <button id="btn-merge" title="Append pages from another PDF" disabled>Add PDF</button>
      <button id="btn-save" class="primary" title="Download the edited PDF (Ctrl+S)" disabled>Save</button>
    </div>

    <div class="group">
      <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    </div>

    <div class="group tools" id="tools">
      <button data-tool="select" class="active" title="Select / scroll (V)">Select</button>
      <button data-tool="text" title="Add text (T)">Text</button>
      <button data-tool="highlight" title="Highlight (H)">Highlight</button>
      <button data-tool="rect" title="Rectangle (R)">Rect</button>
      <button data-tool="draw" title="Freehand draw (D)">Draw</button>
      <button data-tool="image" title="Place an image (I)">Image</button>
    </div>

    <div class="group options" id="options">
      <label data-for="text highlight rect draw">Color <input type="color" id="opt-color" value="#d1242f"></label>
      <label data-for="text">Size <input type="number" id="opt-size" value="14" min="4" max="200" step="1"></label>
      <label data-for="text">Font
        <select id="opt-font">
          <option>Helvetica</option>
          <option>Helvetica-Bold</option>
          <option>Helvetica-Oblique</option>
          <option>Times-Roman</option>
          <option>Times-Bold</option>
          <option>Times-Italic</option>
          <option>Courier</option>
          <option>Courier-Bold</option>
        </select>
      </label>
      <label data-for="rect draw">Width <input type="range" id="opt-width" value="2" min="0.5" max="20" step="0.5"></label>
      <label data-for="highlight rect draw">Opacity <input type="range" id="opt-opacity" value="100" min="5" max="100" step="5"></label>
      <label data-for="rect"><input type="checkbox" id="opt-fill"> Fill</label>
    </div>

    <div class="group zoom">
      <button id="zoom-out" title="Zoom out (Ctrl+-)">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Zoom in (Ctrl+=)">+</button>
      <button id="zoom-fit" title="Fit width">Fit</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-actions">
        <button id="pg-rotl" title="Rotate selected pages left">⟲</button>
        <button id="pg-rotr" title="Rotate selected pages right">⟳</button>
        <button id="pg-dup" title="Duplicate selected pages">⧉</button>
        <button id="pg-blank" title="Insert blank page after selection">＋</button>
        <button id="pg-extract" title="Download selected pages as a new PDF">⤓</button>
        <button id="pg-del" class="danger" title="Delete selected pages">✕</button>
      </div>
      <div id="thumbs"></div>
      <div class="sidebar-hint">Click to select · Ctrl/Shift for multi · drag to reorder</div>
    </aside>

    <section id="viewer">
      <div id="empty">
        <h1>PDF Editor</h1>
        <p>Open or drop a PDF to get started. Nothing leaves your device — the whole editor runs offline in your browser.</p>
        <div>
          <button id="empty-open" class="primary">Open PDF</button>
          <button id="empty-new">New blank</button>
        </div>
      </div>
      <div id="pages"></div>
    </section>
  </main>

  <footer id="status">Ready</footer>

  <div id="text-editor" hidden>
    <textarea id="text-input" rows="2" placeholder="Type, then Ctrl+Enter"></textarea>
    <div class="text-editor-actions">
      <button id="text-cancel">Cancel</button>
      <button id="text-commit" class="primary">Add</button>
    </div>
  </div>

  <div id="drop-hint" hidden>Drop PDF to open</div>

  <input type="file" id="file-open" accept="application/pdf,.pdf" hidden>
  <input type="file" id="file-merge" accept="application/pdf,.pdf" hidden>
  <input type="file" id="file-image" accept="image/*" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
